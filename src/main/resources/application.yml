server:
  port: 8081

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [turn:%X{turnId:-}] [task:%X{taskId:-}] [llm:%X{llmCallNo:-}] [%thread] %logger{36} - %msg%n%ex"

spring:
  datasource:
    url: "jdbc:mysql://${DATAPILOT_DB_HOST:localhost}:${DATAPILOT_DB_PORT:3306}/${DATAPILOT_DB_NAME:}"
    username: ${DATAPILOT_DB_USERNAME:}
    password: ${DATAPILOT_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 按需建立连接，数据库不可用时不影响其他 Agent 能力启动。
      minimum-idle: 0
      maximum-pool-size: 5
      initialization-fail-timeout: -1
      connection-timeout: 5000
      data-source-properties:
        databaseTerm: CATALOG
        connectTimeout: 5000
        socketTimeout: 10000
  sql:
    init:
      mode: never

qwen:
  api-key: ${DASHSCOPE_API_KEY:}
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-plus

harness:
  workspace: "F:/project"

datapilot:
  skills-directory: ${DATAPILOT_SKILLS_DIR:skills}
  database:
    query:
      max-result-bytes: ${DATAPILOT_DB_MAX_RESULT_BYTES:262144}
    sensitive-fields:
      deny:
        - password
        - passwd
        - secret
        - token
        - salt
        - api_key
      mask:
        - phone
        - mobile
        - email
        - id_card
