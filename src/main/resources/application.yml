server:
  port: 8081

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [turn:%X{turnId:-}] [task:%X{taskId:-}] [llm:%X{llmCallNo:-}] [%thread] %logger{36} - %msg%n%ex"

spring:
  datasource:
    url: "jdbc:mysql://${DATAPILOT_DB_HOST:localhost}:${DATAPILOT_DB_PORT:3306}/${DATAPILOT_DB_NAME:}"
    username: ${DATAPILOT_DB_USERNAME:}
    password: ${DATAPILOT_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 按需建立连接，数据库不可用时不影响其他 Agent 能力启动。
      minimum-idle: 0
      maximum-pool-size: 5
      initialization-fail-timeout: -1
      connection-timeout: 5000
      data-source-properties:
        databaseTerm: CATALOG
        connectTimeout: 5000
        socketTimeout: 10000
  sql:
    init:
      mode: never

llm:
  api-key: ${LLM_API_KEY:}
  base-url: ${LLM_BASE_URL:https://api.deepseek.com}
  model: ${LLM_MODEL:deepseek-flash}

harness:
  workspace: "F:/project"

datapilot:
  skills-directory: ${DATAPILOT_SKILLS_DIR:skills}
  database:
    query:
      max-result-bytes: ${DATAPILOT_DB_MAX_RESULT_BYTES:262144}
    sensitive-fields:
      deny:
        - password
        - passwd
        - secret
        - token
        - salt
        - api_key
      mask:
        - phone
        - mobile
        - email
        - id_card
  chart:
    enabled: ${DATAPILOT_CHART_ENABLED:false}
    output-directory: ${DATAPILOT_CHART_DIR:}
    timeout-seconds: ${DATAPILOT_CHART_TIMEOUT_SECONDS:15}
    query-timeout-seconds: ${DATAPILOT_CHART_QUERY_TIMEOUT_SECONDS:10}
    max-input-rows: ${DATAPILOT_CHART_MAX_INPUT_ROWS:5000}
    max-input-bytes: ${DATAPILOT_CHART_MAX_INPUT_BYTES:5242880}
    max-stdout-bytes: ${DATAPILOT_CHART_MAX_STDOUT_BYTES:65536}
    max-stderr-bytes: ${DATAPILOT_CHART_MAX_STDERR_BYTES:65536}
    max-image-bytes: ${DATAPILOT_CHART_MAX_IMAGE_BYTES:2097152}
    max-width: ${DATAPILOT_CHART_MAX_WIDTH:2400}
    max-height: ${DATAPILOT_CHART_MAX_HEIGHT:1600}
    retention-hours: ${DATAPILOT_CHART_RETENTION_HOURS:24}
    max-artifacts: ${DATAPILOT_CHART_MAX_ARTIFACTS:200}
    max-categories: ${DATAPILOT_CHART_MAX_CATEGORIES:50}
    max-series: ${DATAPILOT_CHART_MAX_SERIES:12}
    max-points: ${DATAPILOT_CHART_MAX_POINTS:2000}
